<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PAPPRITO POS</title>

<link rel="stylesheet"
      href="../assets/css/pos.css">

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- ==========================================
     POS HEADER
========================================== -->

<header class="pos-header">

    <div class="logo">

        <img src="../assets/img/logo.png"
             alt="Logo">

        <div>

            <h2>PAPPRITO POS</h2>

            <small>Restaurant Management</small>

        </div>

    </div>

    <div class="header-search">

        <input

            type="text"

            id="searchProduct"

            placeholder="Search Product...">

    </div>

    <div class="header-user">

        <button id="btnBack">

            <i class="fa fa-arrow-left"></i>

            Dashboard

        </button>

    </div>

</header>

<!-- ==========================================
     MAIN
========================================== -->

<div class="pos-main">

    <!-- CATEGORY -->

    <aside class="category-panel">

        <h3>Categories</h3>

        <div id="categoryList"></div>

    </aside>

    <!-- PRODUCTS -->

    <section class="product-panel">

        <div id="productGrid"
             class="product-grid">

        </div>

    </section>

    <!-- CART -->

    <aside class="cart-panel">

        <h3>Current Order</h3>

        <div id="cartItems">

            No Item

        </div>

        <div class="cart-footer">

            <div class="total-row">

                <span>Total</span>

                <strong id="cartTotal">

                    ₱0.00

                </strong>

            </div>

            <button id="checkoutBtn">

                Checkout

            </button>

        </div>

    </aside>

</div>

<!-- ==========================================
     FIREBASE
========================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="../firebase/firebase-config.js"></script>

<!-- POS -->

<script src="../assets/js/pos/pos-init.js"></script>

<script src="../assets/js/pos/pos-category.js"></script>

<script src="../assets/js/pos/pos-product.js"></script>

<script src="../assets/js/pos/pos-cart.js"></script>

<script src="../assets/js/pos/pos-payment.js"></script>

</body>

</html>
