<header class="pos-header">

    <button id="btnBack" class="back-btn">

    </button>

    <div class="pos-title">
        <img src="../assets/images/logo/logo.png" alt="PAPPRITO Logo">
        <div>
            <h2>PAPPRITO POS</h2>
            <small>Restaurant Point of Sale</small>
        </div>

    <div class="header-right">

    </div>
