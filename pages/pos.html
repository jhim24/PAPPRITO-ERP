<!--
==========================================================
PAPPRITO ERP
Module : Point of Sale (POS)
File   : pages/pos.html
Description : Full Screen POS
==========================================================
-->

<!-- ==========================================================
     POS HEADER
========================================================== -->

<header class="pos-header">

    <button id="btnBack" class="back-btn">
        ← Back
    </button>

    <div class="pos-title">
        <img src="../assets/images/logo/logo.png" alt="PAPPRITO Logo">
        <div>
            <h2>PAPPRITO POS</h2>
            <small>Restaurant Point of Sale</small>
        </div>
    </div>

    <div class="header-right">

        <input
            type="text"
            id="searchProduct"
            placeholder="Search Product...">

        <span id="cashierName">
            Administrator
        </span>

        <span id="currentDateTime">
            --/--/---- --:--
        </span>

    </div>

</header>
<!-- ==========================================================
     POS MAIN CONTENT
========================================================== -->

<main class="pos-container">

    <!-- ==========================================================
         CATEGORY PANEL
    ========================================================== -->

    <aside class="category-panel">

        <div id="categoryList">

            <!-- Categories loaded from Firebase -->

        </div>

    </aside>

    <!-- ==========================================================
         PRODUCT PANEL
    ========================================================== -->

    <section class="product-panel">

        <div id="productGrid">

            <!-- Products loaded from Firebase -->

        </div>

    </section>

    <!-- ==========================================================
         SHOPPING CART
    ========================================================== -->

    <aside class="cart-panel">

        <div id="cartItems">

            <!-- Cart Items -->

        </div>

    </aside>

</main>

<!-- ==========================================================
     PAYMENT PANEL
========================================================== -->

<footer class="payment-panel">

</footer>
