<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================================
         PAPPRITO ERP
         STANDALONE FULLSCREEN POS
         File: pages/pos.html

         IMPORTANT:
         - NO ERP sidebar
         - NO ERP navbar
         - NO app.js
         - Firebase loads BEFORE POS engine
         - Responsive desktop / tablet / mobile
    ========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#C8102E">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <title>PAPPRITO POS</title>


    <!-- ==========================================================
         BOOTSTRAP CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <!-- ==========================================================
         FONT AWESOME
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- ==========================================================
         POS CSS ONLY
    ========================================================== -->

    <link
        rel="stylesheet"
        href="../assets/css/pos.css">


    <!-- ==========================================================
         FIREBASE SDK
         IMPORTANT:
         Firebase MUST load before pos.js
    ========================================================== -->

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
    </script>

    <script
        src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js">
    </script>


    <!-- ==========================================================
         PAPPRITO FIREBASE CONFIG
    ========================================================== -->

    <script>

        "use strict";


        // ======================================================
        // FIREBASE CONFIGURATION
        // ======================================================

        const firebaseConfig = {

            apiKey:
                "AIzaSyAV9T5w_1azmPHIJcZpraXP06TItj7HEuA",

            authDomain:
                "papprito-orders.firebaseapp.com",

            databaseURL:
                "https://papprito-orders-default-rtdb.firebaseio.com",

            projectId:
                "papprito-orders",

            storageBucket:
                "papprito-orders.firebasestorage.app",

            messagingSenderId:
                "831941801424",

            appId:
                "1:831941801424:web:40a99cdfb312dac2d275d5"

        };


        // ======================================================
        // INITIALIZE FIREBASE
        // ======================================================

        try {

            if (
                typeof firebase === "undefined"
            ) {

                throw new Error(
                    "Firebase SDK is not loaded."
                );

            }


            if (
                !firebase.apps.length
            ) {

                firebase.initializeApp(
                    firebaseConfig
                );

                console.log(
                    "✅ Firebase App Initialized"
                );

            }

            else {

                console.log(
                    "✅ Firebase App Already Initialized"
                );

            }


            // ==================================================
            // GLOBAL DATABASE
            // ==================================================

            window.db =
                firebase.database();


            window.firebaseApp =
                firebase.app();


            window.firebaseConfig =
                firebaseConfig;


            console.log(
                "✅ PAPPRITO ERP Firebase Connected"
            );


            console.log(
                "✅ Realtime Database Ready"
            );

        }

        catch (error) {

            console.error(
                "❌ Firebase Initialization Error:",
                error
            );

        }

    </script>

</head>


<body class="papprito-pos-page">


<!-- ==========================================================
     POS APPLICATION
========================================================== -->

<div
    id="pappritoPOS"
    class="papprito-pos">


    <!-- ======================================================
         POS HEADER
    ======================================================= -->

    <header class="pos-header">


        <!-- ==================================================
             BRAND
        ================================================== -->

        <div class="pos-header-left">

            <div class="pos-brand">

                <div class="pos-brand-icon">

                    <i class="fa-solid fa-cash-register"></i>

                </div>


                <div class="pos-brand-text">

                    <div class="pos-brand-name">

                        PAPPRITO POS

                    </div>


                    <div class="pos-brand-subtitle">

                        Restaurant Cashier

                    </div>

                </div>

            </div>

        </div>


        <!-- ==================================================
             CENTER
        ================================================== -->

        <div class="pos-header-center">

            <div class="pos-terminal-title">

                <i class="fa-solid fa-store"></i>

                CASHIER

            </div>


            <div
                id="posDateTime"
                class="pos-date-time">

                --

            </div>

        </div>


        <!-- ==================================================
             RIGHT
        ================================================== -->

        <div class="pos-header-right">


            <button
                type="button"
                class="pos-header-action"
                id="posHoldBtn"
                title="Hold Order">

                <i class="fa-solid fa-pause"></i>

                <span>
                    Hold
                </span>

            </button>


            <button
                type="button"
                class="pos-header-action"
                id="posRecallBtn"
                title="Recall Order">

                <i class="fa-solid fa-clock-rotate-left"></i>

                <span>
                    Recall
                </span>

            </button>


            <button
                type="button"
                class="pos-header-action"
                id="posExitBtn"
                title="Back to ERP">

                <i class="fa-solid fa-right-from-bracket"></i>

                <span>
                    Exit
                </span>

            </button>

        </div>

    </header>



    <!-- ======================================================
         POS WORKSPACE
    ======================================================= -->

    <main class="pos-main">


        <!-- ==================================================
             CURRENT ORDER
        ================================================== -->

        <section class="pos-order-panel">


            <!-- ==================================================
                 ORDER HEADER
            ================================================== -->

            <div class="pos-panel-header">


                <div>

                    <div class="pos-panel-title">

                        <i class="fa-solid fa-receipt"></i>

                        Current Order

                    </div>


                    <div
                        id="posOrderNumber"
                        class="pos-order-number">

                        New Order

                    </div>

                </div>


                <button
                    type="button"
                    class="pos-clear-order"
                    id="posClearCartBtn"
                    title="Clear Order">

                    <i class="fa-solid fa-trash-can"></i>

                </button>

            </div>



            <!-- ==================================================
                 CART
            ================================================== -->

            <div
                id="posCart"
                class="pos-cart">


                <div class="pos-empty-cart">


                    <div class="pos-empty-icon">

                        <i class="fa-solid fa-cart-shopping"></i>

                    </div>


                    <strong>
                        No Items
                    </strong>


                    <span>
                        Select a product to start
                    </span>


                </div>

            </div>



            <!-- ==================================================
                 ORDER SUMMARY
            ================================================== -->

            <div class="pos-order-summary">


                <div class="pos-summary-row">

                    <span>
                        Subtotal
                    </span>


                    <strong id="posSubtotal">

                        ₱0.00

                    </strong>

                </div>



                <div class="pos-summary-row">

                    <span>
                        Discount
                    </span>


                    <strong id="posDiscountAmount">

                        ₱0.00

                    </strong>

                </div>



                <div class="pos-summary-row">

                    <span>
                        Tax
                    </span>


                    <strong id="posTax">

                        ₱0.00

                    </strong>

                </div>



                <div class="pos-summary-total">

                    <span>
                        TOTAL
                    </span>


                    <strong id="posGrandTotal">

                        ₱0.00

                    </strong>

                </div>

            </div>

        </section>



        <!-- ==================================================
             CATEGORY PANEL
        ================================================== -->

        <section class="pos-category-panel">


            <div class="pos-panel-header">

                <div class="pos-panel-title">

                    <i class="fa-solid fa-layer-group"></i>

                    Categories

                </div>

            </div>



            <div
                id="posCategories"
                class="pos-categories">


                <div class="pos-products-loading">

                    <div
                        class="spinner-border text-danger">
                    </div>


                    <span>
                        Loading categories...
                    </span>

                </div>

            </div>



            <!-- ==================================================
                 QUICK ENTRY
            ================================================== -->

            <div class="pos-keypad-section">


                <div class="pos-keypad-title">

                    <i class="fa-solid fa-calculator"></i>

                    Quick Entry

                </div>


                <div class="pos-keypad">


                    <button
                        type="button"
                        class="pos-key"
                        data-key="7">

                        7

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="8">

                        8

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="9">

                        9

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="4">

                        4

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="5">

                        5

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="6">

                        6

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="1">

                        1

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="2">

                        2

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="3">

                        3

                    </button>


                    <button
                        type="button"
                        class="pos-key key-zero"
                        data-key="0">

                        0

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key=".">

                        .

                    </button>


                    <button
                        type="button"
                        class="pos-key key-clear"
                        data-key="clear">

                        C

                    </button>


                </div>

            </div>

        </section>



        <!-- ==================================================
             PRODUCTS
        ================================================== -->

        <section class="pos-product-panel">


            <!-- ==================================================
                 PRODUCT TOOLBAR
            ================================================== -->

            <div class="pos-product-toolbar">


                <div class="pos-search-wrapper">


                    <i
                        class="fa-solid fa-magnifying-glass">
                    </i>


                    <input
                        type="search"
                        id="posProductSearch"
                        class="pos-product-search"
                        placeholder="Search products..."
                        autocomplete="off">


                </div>



                <button
                    type="button"
                    class="pos-refresh-btn"
                    id="posRefreshProductsBtn"
                    title="Refresh Products">


                    <i class="fa-solid fa-rotate"></i>


                </button>


            </div>



            <!-- ==================================================
                 PRODUCT GRID
            ================================================== -->

            <div
                id="posProducts"
                class="pos-products">


                <div class="pos-products-loading">


                    <div
                        class="spinner-border text-danger">
                    </div>


                    <span>
                        Loading products...
                    </span>


                </div>


            </div>

        </section>


    </main>



    <!-- ======================================================
         PAYMENT BAR
    ======================================================= -->

    <section class="pos-payment-bar">


        <!-- ==================================================
             CUSTOMER
        ================================================== -->

        <div class="pos-payment-customer">


            <label>

                <i class="fa-solid fa-user"></i>

                Customer

            </label>


            <input
                type="text"
                id="posCustomerName"
                placeholder="Walk-in Customer"
                autocomplete="off">


        </div>



        <!-- ==================================================
             PAYMENT METHOD
        ================================================== -->

        <div class="pos-payment-method">


            <label>
                Payment Method
            </label>


            <div class="pos-payment-buttons">


                <button
                    type="button"
                    class="pos-payment-method-btn active"
                    data-payment-method="Cash"
                    data-method="Cash">


                    <i class="fa-solid fa-money-bill-wave"></i>

                    Cash


                </button>



                <button
                    type="button"
                    class="pos-payment-method-btn"
                    data-payment-method="Card"
                    data-method="Card">


                    <i class="fa-solid fa-credit-card"></i>

                    Card


                </button>



                <button
                    type="button"
                    class="pos-payment-method-btn"
                    data-payment-method="GCash"
                    data-method="GCash">


                    <i class="fa-solid fa-mobile-screen-button"></i>

                    GCash


                </button>



                <button
                    type="button"
                    class="pos-payment-method-btn"
                    data-payment-method="Other"
                    data-method="Other">


                    <i class="fa-solid fa-ellipsis"></i>

                    Other


                </button>


            </div>

        </div>



        <!-- ==================================================
             DISCOUNT
        ================================================== -->

        <div class="pos-payment-input">


            <label>
                Discount
            </label>


            <div class="pos-money-input">


                <span>
                    ₱
                </span>


                <input
                    type="number"
                    id="posDiscount"
                    min="0"
                    step="0.01"
                    placeholder="0.00">


            </div>

        </div>



        <!-- ==================================================
             AMOUNT RECEIVED
             IMPORTANT:
             ID MUST MATCH pos.js
        ================================================== -->

        <div class="pos-payment-input">


            <label>
                Amount Received
            </label>


            <div class="pos-money-input">


                <span>
                    ₱
                </span>


                <input
                    type="number"
                    id="posAmountReceived"
                    min="0"
                    step="0.01"
                    placeholder="0.00">


            </div>

        </div>



        <!-- ==================================================
             CHANGE
        ================================================== -->

        <div class="pos-change-box">


            <span>
                CHANGE
            </span>


            <strong id="posChange">

                ₱0.00

            </strong>


        </div>



        <!-- ==================================================
             PAY
        ================================================== -->

        <button
            type="button"
            class="pos-pay-btn"
            id="posPayBtn">


            <i class="fa-solid fa-check"></i>


            <span>
                PAY
            </span>


        </button>


    </section>



    <!-- ======================================================
         PAYMENT MODAL
    ======================================================= -->

    <div
        class="modal fade"
        id="posPaymentModal"
        tabindex="-1"
        aria-hidden="true">


        <div
            class="modal-dialog modal-dialog-centered">


            <div
                class="modal-content pos-payment-modal">


                <div class="modal-header">


                    <h5 class="modal-title">


                        <i
                            class="fa-solid fa-money-bill-wave">
                        </i>


                        Complete Payment


                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>


                </div>



                <div class="modal-body">


                    <div class="pos-modal-total">


                        <span>
                            Total
                        </span>


                        <strong id="posModalTotal">

                            ₱0.00

                        </strong>


                    </div>



                    <label class="form-label">

                        Amount Received

                    </label>


                    <input
                        type="number"
                        id="posModalAmountReceived"
                        class="form-control form-control-lg"
                        min="0"
                        step="0.01"
                        placeholder="0.00">



                    <div class="pos-modal-change">


                        <span>
                            Change
                        </span>


                        <strong id="posModalChange">

                            ₱0.00

                        </strong>


                    </div>


                </div>



                <div class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>



                    <button
                        type="button"
                        class="btn btn-danger"
                        id="posConfirmPaymentBtn">


                        <i class="fa-solid fa-check"></i>


                        Confirm Payment


                    </button>


                </div>


            </div>


        </div>


    </div>



    <!-- ======================================================
         RECEIPT MODAL
    ======================================================= -->

    <div
        class="modal fade"
        id="posReceiptModal"
        tabindex="-1"
        aria-hidden="true">


        <div
            class="modal-dialog modal-dialog-centered">


            <div class="modal-content">


                <div class="modal-header">


                    <h5 class="modal-title">


                        <i class="fa-solid fa-receipt"></i>


                        Receipt


                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>


                </div>



                <!-- ==================================================
                     IMPORTANT:
                     pos.js expects posReceiptContent
                ================================================== -->

                <div
                    id="posReceiptContent"
                    class="modal-body">


                </div>



                <div class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>



                    <!-- ==================================================
                         IMPORTANT:
                         pos.js expects posPrintReceiptBtn
                    ================================================== -->

                    <button
                        type="button"
                        class="btn btn-danger"
                        id="posPrintReceiptBtn">


                        <i class="fa-solid fa-print"></i>


                        Print Receipt


                    </button>


                </div>


            </div>


        </div>


    </div>



    <!-- ======================================================
         POS STATUS
    ======================================================= -->

    <div
        id="posStatus"
        class="pos-status"
        aria-live="polite">
    </div>


</div>



<!-- ==========================================================
     BOOTSTRAP JS
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ==========================================================
     POS ENGINE
     
     IMPORTANT:
     Firebase is already initialized above.
     Therefore pos.js can safely use window.db.
========================================================== -->

<script
    src="../assets/js/pos/pos.js">
</script>



<!-- ==========================================================
     EXIT POS
========================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        const exitButton =
            document.getElementById(
                "posExitBtn"
            );


        if (exitButton) {

            exitButton.addEventListener(
                "click",
                function () {

                    localStorage.setItem(
                        "currentPage",
                        "pages/dashboard.html"
                    );


                    window.location.href =
                        "../index.html";

                }
            );

        }

    }
);

</script>



</body>

</html>
