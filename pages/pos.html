<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ==========================================================
         PAPPRITO POS
         FINAL INTEGRATED POS
         File: pages/pos.html
    ========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
        name="theme-color"
        content="#C8102E">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">

    <title>PAPPRITO POS</title>


    <!-- ==========================================================
         FAVICON
    ========================================================== -->

    <link
        rel="icon"
        type="image/png"
        href="../assets/img/logo.png">


    <!-- ==========================================================
         BOOTSTRAP
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">


    <!-- ==========================================================
         FONT AWESOME
    ========================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


    <!-- ==========================================================
         POS CSS
    ========================================================== -->

    <link
        rel="stylesheet"
        href="../assets/css/pos.css">

</head>


<body class="papprito-pos">


<!-- ==========================================================
     POS APPLICATION
========================================================== -->

<div id="posApp" class="pos-app">


    <!-- ======================================================
         POS HEADER
    ======================================================= -->

    <header class="pos-header">

        <!-- LEFT -->
        <div class="pos-header-left">

            <div class="pos-brand">

                <div class="pos-brand-icon">

                    <i class="fa-solid fa-utensils"></i>

                </div>


                <div class="pos-brand-info">

                    <div class="pos-brand-name">
                        PAPPRITO
                    </div>

                    <div class="pos-brand-subtitle">
                        RESTAURANT POS
                    </div>

                </div>

            </div>

        </div>


        <!-- CENTER -->
        <div class="pos-header-center">

            <div class="pos-terminal">

                <i class="fa-solid fa-cash-register"></i>

                <span>
                    CASHIER
                </span>

            </div>


            <div
                id="posDateTime"
                class="pos-date-time">
                --
            </div>

        </div>


        <!-- RIGHT -->
        <div class="pos-header-right">

            <button
                type="button"
                id="posFullscreenBtn"
                class="pos-header-btn"
                title="Fullscreen">

                <i class="fa-solid fa-expand"></i>

                <span>
                    Fullscreen
                </span>

            </button>


            <button
                type="button"
                id="posHoldBtn"
                class="pos-header-btn"
                title="Hold Order">

                <i class="fa-solid fa-pause"></i>

                <span>
                    Hold
                </span>

            </button>


            <button
                type="button"
                id="posRecallBtn"
                class="pos-header-btn"
                title="Recall Order">

                <i class="fa-solid fa-clock-rotate-left"></i>

                <span>
                    Recall
                </span>

            </button>


            <button
                type="button"
                id="posLogoutBtn"
                class="pos-header-btn pos-logout-btn"
                title="Close POS">

                <i class="fa-solid fa-power-off"></i>

            </button>

        </div>

    </header>



    <!-- ======================================================
         POS BODY
    ======================================================= -->

    <main class="pos-body">


        <!-- ==================================================
             ORDER PANEL
        ================================================== -->

        <section class="pos-order-panel">


            <!-- ORDER HEADER -->

            <div class="pos-panel-header">

                <div>

                    <div class="pos-panel-title">

                        <i class="fa-solid fa-receipt"></i>

                        Current Order

                    </div>


                    <div
                        id="posOrderNumber"
                        class="pos-order-number">

                        NEW ORDER

                    </div>

                </div>


                <button
                    type="button"
                    id="posClearCartBtn"
                    class="pos-clear-btn"
                    title="Clear Order">

                    <i class="fa-solid fa-trash-can"></i>

                </button>

            </div>



            <!-- CUSTOMER -->

            <div class="pos-order-customer">

                <label
                    for="posCustomerName">

                    <i class="fa-solid fa-user"></i>

                    Customer

                </label>


                <input
                    type="text"
                    id="posCustomerName"
                    class="pos-customer-input"
                    placeholder="Walk-in Customer"
                    autocomplete="off">

            </div>



            <!-- CART -->

            <div
                id="posCart"
                class="pos-cart">

                <div class="pos-empty-cart">

                    <i class="fa-solid fa-cart-shopping"></i>

                    <strong>
                        No Items
                    </strong>

                    <span>
                        Select a product to start
                    </span>

                </div>

            </div>



            <!-- ORDER SUMMARY -->

            <div class="pos-order-summary">


                <div class="pos-summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="posSubtotal">
                        ₱0.00
                    </strong>

                </div>


                <div class="pos-summary-row">

                    <span>
                        Discount
                    </span>


                    <div class="pos-discount-control">

                        <span>
                            ₱
                        </span>

                        <input
                            type="number"
                            id="posDiscount"
                            min="0"
                            step="0.01"
                            value="0"
                            placeholder="0.00">

                    </div>

                </div>


                <div class="pos-summary-row">

                    <span>
                        Tax
                    </span>

                    <strong id="posTax">
                        ₱0.00
                    </strong>

                </div>


                <div class="pos-summary-total">

                    <span>
                        TOTAL
                    </span>

                    <strong id="posTotal">
                        ₱0.00
                    </strong>

                </div>

            </div>

        </section>



        <!-- ==================================================
             CENTER PANEL
             CATEGORIES
        ================================================== -->

        <section class="pos-middle-panel">


            <!-- CATEGORY HEADER -->

            <div class="pos-panel-header">

                <div class="pos-panel-title">

                    <i class="fa-solid fa-layer-group"></i>

                    Categories

                </div>

            </div>



            <!-- CATEGORY BUTTONS -->

            <div
                id="posCategories"
                class="pos-categories">

                <div class="pos-loading">

                    <div class="spinner-border text-danger"></div>

                    <span>
                        Loading categories...
                    </span>

                </div>

            </div>



            <!-- QUICK ENTRY -->

            <div class="pos-keypad-section">

                <div class="pos-keypad-title">

                    <i class="fa-solid fa-calculator"></i>

                    Quick Entry

                </div>


                <div class="pos-keypad">


                    <button
                        type="button"
                        class="pos-key"
                        data-key="7">
                        7
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="8">
                        8
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="9">
                        9
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="4">
                        4
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="5">
                        5
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="6">
                        6
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="1">
                        1
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="2">
                        2
                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key="3">
                        3
                    </button>


                    <button
                        type="button"
                        class="pos-key key-zero"
                        data-key="0">

                        0

                    </button>


                    <button
                        type="button"
                        class="pos-key"
                        data-key=".">

                        .

                    </button>


                    <button
                        type="button"
                        class="pos-key key-clear"
                        data-key="clear">

                        C

                    </button>

                </div>

            </div>

        </section>



        <!-- ==================================================
             PRODUCT PANEL
        ================================================== -->

        <section class="pos-product-panel">


            <!-- PRODUCT TOOLBAR -->

            <div class="pos-product-toolbar">


                <div class="pos-product-title">

                    <i class="fa-solid fa-box-open"></i>

                    Products

                </div>


                <div class="pos-product-actions">


                    <!-- SEARCH -->

                    <div class="pos-search-box">

                        <i class="fa-solid fa-magnifying-glass"></i>


                        <input
                            type="search"
                            id="posProductSearch"
                            placeholder="Search products..."
                            autocomplete="off">

                    </div>


                    <!-- REFRESH -->

                    <button
                        type="button"
                        id="posRefreshProductsBtn"
                        class="pos-refresh-btn"
                        title="Refresh Products">

                        <i class="fa-solid fa-rotate"></i>

                    </button>

                </div>

            </div>



            <!-- PRODUCTS -->

            <div
                id="posProducts"
                class="pos-products">

                <div class="pos-loading">

                    <div class="spinner-border text-danger"></div>

                    <span>
                        Loading products...
                    </span>

                </div>

            </div>

        </section>

    </main>



    <!-- ======================================================
         PAYMENT BAR
    ======================================================= -->

    <section class="pos-payment-bar">


        <!-- PAYMENT METHOD -->

        <div class="pos-payment-section">

            <label>
                <i class="fa-solid fa-credit-card"></i>
                Payment Method
            </label>


            <div class="pos-payment-methods">


                <button
                    type="button"
                    class="pos-payment-method active"
                    data-payment-method="Cash">

                    <i class="fa-solid fa-money-bill-wave"></i>

                    <span>
                        Cash
                    </span>

                </button>


                <button
                    type="button"
                    class="pos-payment-method"
                    data-payment-method="Card">

                    <i class="fa-solid fa-credit-card"></i>

                    <span>
                        Card
                    </span>

                </button>


                <button
                    type="button"
                    class="pos-payment-method"
                    data-payment-method="GCash">

                    <i class="fa-solid fa-mobile-screen-button"></i>

                    <span>
                        GCash
                    </span>

                </button>


                <button
                    type="button"
                    class="pos-payment-method"
                    data-payment-method="Other">

                    <i class="fa-solid fa-ellipsis"></i>

                    <span>
                        Other
                    </span>

                </button>

            </div>

        </div>



        <!-- AMOUNT RECEIVED -->

        <div class="pos-payment-section pos-amount-section">

            <label
                for="posAmountReceived">

                Amount Received

            </label>


            <div class="pos-money-input">

                <span>
                    ₱
                </span>


                <input
                    type="number"
                    id="posAmountReceived"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                    autocomplete="off">

            </div>

        </div>



        <!-- CHANGE -->

        <div class="pos-change-section">

            <span>
                CHANGE
            </span>


            <strong id="posChange">
                ₱0.00
            </strong>

        </div>



        <!-- TOTAL -->

        <div class="pos-payment-total">

            <span>
                TOTAL
            </span>


            <strong id="posPaymentTotal">
                ₱0.00
            </strong>

        </div>



        <!-- PAY -->

        <button
            type="button"
            id="posPayBtn"
            class="pos-pay-btn"
            disabled>

            <i class="fa-solid fa-check"></i>

            <span>
                PAY
            </span>

        </button>

    </section>



    <!-- ======================================================
         PAYMENT MODAL
    ======================================================= -->

    <div
        class="modal fade"
        id="posPaymentModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content pos-modal">


                <div class="modal-header">

                    <h5 class="modal-title">

                        <i class="fa-solid fa-money-bill-wave"></i>

                        Complete Payment

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div class="modal-body">


                    <div class="pos-modal-total">

                        <span>
                            Total
                        </span>


                        <strong id="posModalTotal">
                            ₱0.00
                        </strong>

                    </div>


                    <label
                        for="posModalAmountReceived"
                        class="form-label">

                        Amount Received

                    </label>


                    <input
                        type="number"
                        id="posModalAmountReceived"
                        class="form-control form-control-lg"
                        min="0"
                        step="0.01"
                        placeholder="0.00">


                    <div class="pos-modal-change">

                        <span>
                            Change
                        </span>


                        <strong id="posModalChange">
                            ₱0.00
                        </strong>

                    </div>

                </div>


                <div class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button
                        type="button"
                        id="posConfirmPaymentBtn"
                        class="btn btn-danger">

                        <i class="fa-solid fa-check"></i>

                        Confirm Payment

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ======================================================
         RECEIPT MODAL
    ======================================================= -->

    <div
        class="modal fade"
        id="posReceiptModal"
        tabindex="-1"
        aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content pos-receipt-modal">


                <div class="modal-header">

                    <h5 class="modal-title">

                        <i class="fa-solid fa-receipt"></i>

                        Receipt

                    </h5>


                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>


                <div
                    id="posReceiptContent"
                    class="modal-body pos-receipt-content">

                    <!-- Receipt generated by pos.js -->

                </div>


                <div class="modal-footer">


                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>


                    <button
                        type="button"
                        id="posPrintReceiptBtn"
                        class="btn btn-danger">

                        <i class="fa-solid fa-print"></i>

                        Print Receipt

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ======================================================
         STATUS MESSAGE
    ======================================================= -->

    <div
        id="posStatus"
        class="pos-status"
        aria-live="polite">
    </div>

</div>



<!-- ==========================================================
     BOOTSTRAP JS
========================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ==========================================================
     FIREBASE
========================================================== -->

<script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
</script>


<script
    src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js">
</script>



<!-- ==========================================================
     FIREBASE CONFIG
========================================================== -->

<script
    src="../firebase/firebase-config.js">
</script>



<!-- ==========================================================
     POS ENGINE
========================================================== -->

<script
    src="../assets/js/pos/pos.js">
</script>



<!-- ==========================================================
     POS DATE / TIME
========================================================== -->

<script>

(function () {

    "use strict";


    function updatePOSDateTime() {

        const element =
            document.getElementById(
                "posDateTime"
            );


        if (!element) {

            return;

        }


        const now =
            new Date();


        element.textContent =
            now.toLocaleString(
                "en-PH",
                {
                    year: "numeric",
                    month: "short",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit"
                }
            );

    }


    updatePOSDateTime();


    window.pappritoPOSDateTimer =
        setInterval(
            updatePOSDateTime,
            1000
        );

})();

</script>


</body>

</html>
