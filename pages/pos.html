<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PAPPRITO POS v2</title>

    <!-- ==========================================================
         FONT AWESOME
    ========================================================== -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- ==========================================================
         POS CSS
    ========================================================== -->

    <link rel="stylesheet"
          href="../assets/css/pos.css">

</head>

<body>

<!-- ==========================================================
     POS HEADER
========================================================== -->

<header class="pos-header">

    <div class="header-left">

        <img src="../assets/img/logo.png"
             alt="Logo"
             class="logo">

        <div>

            <h2>PAPPRITO POS</h2>

            <small>Restaurant Point of Sale</small>

        </div>

    </div>

    <div class="header-center">

        <input

            type="text"

            id="searchProduct"

            placeholder="Search Product...">

    </div>

    <div class="header-right">

        <button id="btnBack">

            <i class="fa-solid fa-arrow-left"></i>

            Dashboard

        </button>

    </div>

</header>

<!-- ==========================================================
     MAIN CONTENT
========================================================== -->

<div class="pos-wrapper">

    <!-- ======================================================
         LEFT PANEL
    ======================================================= -->

    <section class="left-panel">

        <!-- CATEGORY -->

        <div class="category-bar">

            <div id="categoryList">

                <!-- Categories -->

            </div>

        </div>

        <!-- PRODUCTS -->

        <div class="products-area">

            <div id="productGrid">

                <!-- Products -->

            </div>

        </div>

    </section>

    <!-- ======================================================
         RIGHT PANEL
    ======================================================= -->

    <aside class="cart-panel">

        <div class="cart-header">

            <div class="cart-title">

    <h3>

        <i class="fa-solid fa-cart-shopping"></i>

        Shopping Cart

    </h3>

    <span id="cartCount">

        0 Items

    </span>

</div>

        </div>

        <!-- ==========================================
             CART TABLE
        ========================================== -->

        <div class="cart-body">

            <table id="cartTable">

                <thead>

                    <tr>

                       <th>Item</th>

<th>Qty</th>

<th>Price</th>

<th>Total</th>

<th></th>
                    </tr>

                </thead>

                <tbody id="cartItems">

                    <!-- Cart -->

                </tbody>

            </table>

        </div>

<!-- ==========================================
     SUMMARY
========================================== -->

<div class="cart-summary">

    <!-- Subtotal -->

    <div class="summary-row">

        <span>Subtotal</span>

        <strong id="subTotal">₱0.00</strong>

    </div>

    <!-- Discount Type -->

    <div class="summary-row">

        <label for="discountType">Discount</label>

        <select id="discountType">

            <option value="none">No Discount</option>

            <option value="pwd">PWD (20%)</option>

            <option value="senior">Senior Citizen (20%)</option>

            <option value="employee">Employee</option>

            <option value="promo">Promo</option>

            <option value="custom">Custom</option>

        </select>

    </div>

    <!-- Discount Value -->

    <div class="summary-row">

        <label for="discount">Value</label>

        <input
            type="number"
            id="discount"
            value="0"
            min="0">

    </div>

    <!-- Payment Method -->

    <div class="summary-row">

        <label for="paymentMethod">Payment</label>

        <select id="paymentMethod">

            <option value="cash">Cash</option>

            <option value="gcash">GCash</option>

            <option value="maya">Maya</option>

            <option value="card">Credit / Debit Card</option>

            <option value="bank">Bank Transfer</option>

            <option value="split">Split Payment</option>

        </select>

    </div>

    <!-- Amount Tendered -->

    <div class="summary-row">

        <label for="cashTendered">Amount</label>

        <input
            type="number"
            id="cashTendered"
            placeholder="0.00">

    </div>

    <!-- Change -->

    <div class="summary-row">

        <span>Change</span>

        <strong id="change">₱0.00</strong>

    </div>

    <!-- Grand Total -->

    <div class="grand-total">

        <span>Grand Total</span>

        <strong id="grandTotal">₱0.00</strong>

    </div>

</div>

        <!-- ==========================================
             BUTTONS
        ========================================== -->

        <div class="cart-buttons">

            <button id="btnClear">

                Clear

            </button>

            <button id="btnCheckout">

                Checkout

            </button>

            <button id="btnPrint">

                Print

            </button>

        </div>

    </aside>

</div>

<!-- ==========================================================
     POS JAVASCRIPT
========================================================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="../firebase/firebase-config.js"></script>

<script src="../assets/js/pos/pos-init.js"></script>
<script src="../assets/js/pos/pos-category.js"></script>
<script src="../assets/js/pos/pos-product.js"></script>
<script src="../assets/js/pos/pos-cart.js"></script>
<script src="../assets/js/pos/pos-payment.js"></script>

</body>

</html>
