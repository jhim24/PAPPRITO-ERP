<!-- ==========================================
     PAPPRITO ERP
     CATEGORY MASTER
========================================== -->

<div class="container-fluid">

    <!-- PAGE HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">

                <i class="fa-solid fa-tags text-danger"></i>

                Category Master

            </h2>

            <small class="text-muted">

                Manage Product Categories

            </small>

        </div>

        <button
            class="btn btn-danger"
            data-bs-toggle="modal"
            data-bs-target="#categoryModal">

            <i class="fa-solid fa-plus"></i>

            Add Category

        </button>

    </div>

    <!-- TOOLBAR -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-lg-4">

                    <input
                        type="text"
                        id="searchCategory"
                        class="form-control"
                        placeholder="Search Category...">

                </div>

                <div class="col-lg-2">

                    <select
                        id="filterStatus"
                        class="form-select">

                        <option value="">

                            All Status

                        </option>

                        <option>

                            Active

                        </option>

                        <option>

                            Inactive

                        </option>

                    </select>

                </div>

                <div class="col-lg-6 text-end">

                    <button
                        class="btn btn-success"
                        id="btnExport">

                        <i class="fa-solid fa-file-excel"></i>

                        Export

                    </button>

                    <button
                        class="btn btn-primary"
                        id="btnRefresh">

                        <i class="fa-solid fa-rotate"></i>

                        Refresh

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- TABLE -->

    <div class="card shadow-sm border-0">

        <div class="card-header bg-white">

            <strong>

                Categories

            </strong>

            <span
                class="float-end">

                Total :

                <span
                    id="totalCategories">

                    0

                </span>

            </span>

        </div>

        <div class="table-responsive">

            <table
                class="table table-hover align-middle mb-0">

                <thead class="table-light">

                    <tr>

                        <th width="120">

                            Code

                        </th>

                        <th width="70">

                            Icon

                        </th>

                        <th>

                            Category

                        </th>

                        <th>

                            Description

                        </th>

                        <th width="120">

                            Products

                        </th>

                        <th width="120">

                            Status

                        </th>

                        <th width="150">

                            Action

                        </th>

                    </tr>

                </thead>

                <tbody id="categoryTable">

                    <tr>

                        <td
                            colspan="7"
                            class="text-center text-muted py-5">

                            No Categories Found

                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- ==========================================
     CATEGORY MODAL
========================================== -->

<div
    class="modal fade"
    id="categoryModal">

    <div class="modal-dialog modal-lg">

        <div class="modal-content">

            <div class="modal-header bg-danger text-white">

                <h5>

                    Add Category

                </h5>

                <button
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body">

                <div class="row g-3">

                    <div class="col-md-4">

                        <label>

                            Category Code

                        </label>

                        <input
                            type="text"
                            id="categoryCode"
                            class="form-control"
                            readonly>

                    </div>

                    <div class="col-md-8">

                        <label>

                            Category Name

                        </label>

                        <input
                            type="text"
                            id="categoryName"
                            class="form-control">

                    </div>

                    <div class="col-md-12">

                        <label>

                            Description

                        </label>

                        <textarea
                            id="categoryDescription"
                            class="form-control">

                        </textarea>

                    </div>

                    <div class="col-md-4">

                        <label>

                            Icon

                        </label>

                        <input
                            type="text"
                            id="categoryIcon"
                            class="form-control"
                            placeholder="fa-utensils">

                    </div>

                    <div class="col-md-4">

                        <label>

                            Color

                        </label>

                        <input
                            type="color"
                            id="categoryColor"
                            class="form-control form-control-color">

                    </div>

                    <div class="col-md-4">

                        <label>

                            Display Order

                        </label>

                        <input
                            type="number"
                            id="displayOrder"
                            class="form-control"
                            value="1">

                    </div>

                    <div class="col-md-4">

                        <label>

                            Status

                        </label>

                        <select
                            id="categoryStatus"
                            class="form-select">

                            <option>

                                Active

                            </option>

                            <option>

                                Inactive

                            </option>

                        </select>

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Cancel

                </button>

                <button
                    class="btn btn-danger"
                    id="btnSaveCategory">

                    Save Category

                </button>

            </div>

        </div>

    </div>

</div>
