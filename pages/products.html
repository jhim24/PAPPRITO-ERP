<!-- ==========================================
     PAPPRITO ERP
     PRODUCT MASTER
========================================== -->

<div class="container-fluid py-4">

    <!-- PAGE HEADER -->

    <div class="row align-items-center mb-4">

        <div class="col-lg-6">

            <h2 class="fw-bold mb-1">

                <i class="fa-solid fa-box-open text-danger"></i>

                Product Master

            </h2>

            <p class="text-muted mb-0">

                Manage all PAPPRITO products used in POS, Kitchen,
                QR Menu and Inventory.

            </p>

        </div>

        <div class="col-lg-6 text-lg-end mt-3 mt-lg-0">

            <button
                class="btn btn-danger"
                data-bs-toggle="modal"
                data-bs-target="#productModal">

                <i class="fa-solid fa-plus"></i>

                Add Product

            </button>

        </div>

    </div>

    <!-- TOOLBAR -->

    <div class="card shadow-sm border-0 mb-4">

        <div class="card-body">

            <div class="row g-3">

                <!-- SEARCH -->

                <div class="col-lg-4">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="fa-solid fa-magnifying-glass"></i>

                        </span>

                        <input
                            type="text"
                            id="searchProduct"
                            class="form-control"
                            placeholder="Search Product">

                    </div>

                </div>

                <!-- CATEGORY FILTER -->

                <div class="col-lg-3">

                    <select
                        id="filterCategory"
                        class="form-select">

                        <option value="">

                            All Categories

                        </option>

                    </select>

                </div>

                <!-- STATUS FILTER -->

                <div class="col-lg-2">

                    <select
                        id="filterStatus"
                        class="form-select">

                        <option value="">

                            All Status

                        </option>

                        <option value="Active">

                            Active

                        </option>

                        <option value="Inactive">

                            Inactive

                        </option>

                    </select>

                </div>

                <!-- ACTION BUTTONS -->

                <div class="col-lg-3 text-lg-end">

                    <button
                        class="btn btn-success"
                        id="btnExportProducts">

                        <i class="fa-solid fa-file-excel"></i>

                        Export

                    </button>

                    <button
                        class="btn btn-primary"
                        id="btnRefreshProducts">

                        <i class="fa-solid fa-rotate"></i>

                        Refresh

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- NEXT STEP:
         Product Table
    -->

</div>
