<!-- ==========================================================
     PAPPRITO ERP
     NAVBAR
     File : components/navbar.html
     Description : Responsive ERP Top Navigation
========================================================== -->

<nav
    class="erp-navbar"
    id="erpNavbar">

    <!-- ======================================================
         LEFT SIDE
    ======================================================= -->

    <div class="navbar-left">

        <!-- MOBILE HAMBURGER -->

        <button
            type="button"
            id="sidebarToggle"
            class="sidebar-toggle"
            aria-label="Open navigation"
            aria-controls="sidebar"
            aria-expanded="false">

            <i class="fa-solid fa-bars"></i>

        </button>


        <!-- BRAND -->

        <div class="navbar-brand">

            <img
                src="assets/img/logo.png"
                alt="PAPPRITO"
                class="navbar-logo">

            <div class="navbar-brand-text">

                <strong>
                    PAPPRITO ERP
                </strong>

                <small>
                    Restaurant Management System
                </small>

            </div>

        </div>

    </div>


    <!-- ======================================================
         CENTER
    ======================================================= -->

    <div class="navbar-center">

        <div class="navbar-page-title">

            <i class="fa-solid fa-house"></i>

            <span id="currentPageTitle">
                Dashboard
            </span>

        </div>

    </div>


    <!-- ======================================================
         RIGHT SIDE
    ======================================================= -->

    <div class="navbar-right">

        <!-- SEARCH -->

        <div class="navbar-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="search"
                id="globalSearch"
                placeholder="Search...">

        </div>


        <!-- NOTIFICATION -->

        <button
            type="button"
            class="navbar-icon-btn"
            id="notificationButton"
            aria-label="Notifications">

            <i class="fa-solid fa-bell"></i>

            <span
                class="notification-badge"
                id="notificationCount">
                0
            </span>

        </button>


        <!-- USER -->

        <div class="navbar-user">

            <div class="navbar-user-avatar">

                <i class="fa-solid fa-user"></i>

            </div>

            <div class="navbar-user-info">

                <strong>
                    Administrator
                </strong>

                <small>
                    Admin
                </small>

            </div>

        </div>

    </div>

</nav>


<!-- ==========================================================
     NAVBAR SCRIPT
========================================================== -->

<script>

(function () {

    "use strict";


    // ======================================================
    // NAVBAR INITIALIZATION
    // ======================================================

    window.initializeNavbar = function () {

        console.log(
            "PAPPRITO Navbar initialized."
        );


        updateCurrentPageTitle();

    };


    // ======================================================
    // UPDATE PAGE TITLE
    // ======================================================

    function updateCurrentPageTitle() {

        const titleElement =
            document.getElementById(
                "currentPageTitle"
            );


        if (!titleElement) {

            return;

        }


        const page =
            localStorage.getItem(
                "currentPage"
            ) || "pages/dashboard.html";


        const titles = {

            "pages/dashboard.html":
                "Dashboard",

            "pages/products.html":
                "Products",

            "pages/categories.html":
                "Categories",

            "pages/inventory.html":
                "Inventory",

            "pages/stock-in.html":
                "Stock In",

            "pages/stock-out.html":
                "Stock Out",

            "pages/purchase-orders.html":
                "Purchase Orders",

            "pages/suppliers.html":
                "Suppliers",

            "pages/customers.html":
                "Customers",

            "pages/sales.html":
                "Sales",

            "pages/reports.html":
                "Reports",

            "pages/employees.html":
                "Employees",

            "pages/attendance.html":
                "Attendance",

            "pages/payroll.html":
                "Payroll",

            "pages/settings.html":
                "Settings",

            "pages/company-profile.html":
                "Company Profile",

            "pages/receiving-orders.html":
                "Receiving Orders",

            "pages/kitchen.html":
                "Kitchen",

            "pages/tables.html":
                "Tables"

        };


        titleElement.textContent =
            titles[page] ||
            "PAPPRITO ERP";

    }


    // ======================================================
    // GLOBAL SEARCH
    // ======================================================

    const searchInput =
        document.getElementById(
            "globalSearch"
        );


    if (searchInput) {

        searchInput.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key !==
                    "Enter"
                ) {

                    return;

                }


                const keyword =
                    searchInput.value.trim();


                if (!keyword) {

                    return;

                }


                console.log(
                    "Global search:",
                    keyword
                );

            }
        );

    }


    // ======================================================
    // NOTIFICATION BUTTON
    // ======================================================

    const notificationButton =
        document.getElementById(
            "notificationButton"
        );


    if (notificationButton) {

        notificationButton.addEventListener(
            "click",
            function () {

                console.log(
                    "Notifications clicked."
                );

            }
        );

    }


})();

</script>
