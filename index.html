<!-- ==========================================================
     SERVICE WORKER
========================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker
                .register("./sw.js")
                .then(
                    function (registration) {

                        console.log(
                            "PAPPRITO Service Worker registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    function (error) {

                        console.warn(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}

</script>

========================================================== -->

<script>

window.addEventListener(
    "load",
    function () {

        console.log(
