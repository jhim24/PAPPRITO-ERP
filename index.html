<!-- ==========================================================
     PWA SERVICE WORKER
========================================================== -->

<script>

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker
                .register("sw.js")
                .then(
                    function (registration) {

                        console.log(
                            "PAPPRITO Service Worker registered:",
                            registration.scope
                        );

                    }
                )
                .catch(
                    function (error) {

                        console.error(
                            "Service Worker registration failed:",
                            error
                        );

                    }
                );

        }
    );

}

</script>


<!-- ==========================================================
     GLOBAL ERROR MONITOR
========================================================== -->

<script>

window.addEventListener(
    "error",
    function (event) {

        console.error(
            "PAPPRITO ERP Error:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function (event) {

        console.error(
            "PAPPRITO ERP Promise Error:",
            event.reason
        );

    }
);

</script>
